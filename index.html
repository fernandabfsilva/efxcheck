/* ======================= GERAÇÃO DE RELATÓRIO (IA) ======================= */
const COMPLIANCE_SYSTEM_PROMPT = `Você é um especialista sênior em PLD-FT (Prevenção à Lavagem de Dinheiro e Financiamento do Terrorismo) e Compliance regulatório, focado em operações de eFX (câmbio eletrônico) na Remessa Online. Você domina o arcabouço normativo brasileiro e internacional aplicável, incluindo, entre outros: Resoluções BCB nº 277/2022, 561/2026, 574/2026, 575/2026, 265/2022, 278/2022, 80/2021; Resoluções CMN nº 4.557/2017, 4.595/2017, 4.968/2021, 5.042/2022, 5.056/2022; Leis nº 9.613/1998, 13.810/2019, 13.260/2016, 14.286/2021, 13.506/2017, 13.709/2018, 14.478/2022, 4.595/1964, 12.865/2013; Circular BCB nº 3.978/2020; Carta Circular nº 4.001/2020; Instruções Normativas 693, 752 e 756; Resoluções CNSU 1267, 1373, 1718 e 2231; Guias de tipologias do COAF; as 40 Recomendações do GAFI e suas listas cinza e negra; e a lista de países sancionados da OFAC.

Sua tarefa é redigir a seção de ANÁLISE DE COMPLIANCE de um relatório de validação ACAM para um cliente eFX, com base nos dados quantitativos fornecidos. Escreva em português do Brasil, em tom técnico-profissional, objetivo, sem saudações nem introduções genéricas. Estruture o texto em parágrafos curtos cobrindo: (1) leitura geral do volume e concentração de operações; (2) riscos de PLD-FT identificáveis a partir das divergências apontadas (merchants não cadastrados, movimentação de merchants reprovados, concentração excessiva, ausência de movimentação de merchants aprovados); (3) fundamentação normativa objetiva (cite os normativos mais pertinentes ao ponto levantado, sem listar todos os normativos genericamente); (4) recomendações de ação concretas para o analista. Não invente dados que não estejam nas informações fornecidas. Seja direto e não repita os números já apresentados em tabelas, apenas interprete-os.`;

async function gerarRelatorio(clienteId){
  if(bloquearConsulta()) return;
  const c = getClient(clienteId);
  const analysis = acamAnalysis[clienteId];
  if(!analysis){ showToast('Realize a validação ACAM antes de gerar o relatório.'); return; }

  const btn = document.getElementById('btn-gerar-relatorio');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Gerando…'; }

  const dadosResumo = {
    cliente: c.razaoSocial,
    cnpj: c.cnpj,
    status: c.status,
    totalGeral: analysis.totalGeral,
    totalBrasil: analysis.totalBrasil,
    merchantsNoArquivo: Object.keys(analysis.porMerchant).length,
    merchantsCadastrados: (c.merchants||[]).length,
    topMerchants: Object.entries(analysis.porMerchant).sort((a,b)=>b[1]-a[1]).slice(0,5),
    topClientes: Object.entries(analysis.porClienteBR||{}).map(([nome, info]) => [nome, info.total]).sort((a,b)=>b[1]-a[1]).slice(0,5),
    divergencias: analysis.flags.map(f=>f.texto)
  };

  let narrativa = '';
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: COMPLIANCE_SYSTEM_PROMPT,
        messages: [{ role: "user", content: `Dados quantitativos do cruzamento ACAM para análise:\n${JSON.stringify(dadosResumo, null, 2)}` }]
      })
    });
    const data = await response.json();
    narrativa = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n\n');
    if(!narrativa) throw new Error('Resposta vazia');
  }catch(err){
    narrativa = gerarNarrativaFallback(c, analysis);
  }

  const relatorio = {
    id: uid('rel'),
    data: new Date().toISOString(),
    fileName: analysis.fileName,
    resumo: dadosResumo,
    narrativa,
    conferidoPor: nomeAnalistaAtivo(),
    statusValidacao: 'rascunho', // rascunho | em_validacao | aprovado | rejeitado
    enviadoPor: '', enviadoEm: '',
    aprovadoPor: '', aprovadoEm: '',
    comentarioGerencia: ''
  };
  c.relatorios = c.relatorios || [];
  c.relatorios.push(relatorio);
  logAction(clienteId, 'Relatório de validação ACAM gerado', `Arquivo ${analysis.fileName}`);
  saveData();

  if(btn){ btn.disabled = false; btn.textContent = 'Gerar relatório'; }
  abrirRelatorio(clienteId, relatorio.id);
}

function gerarNarrativaFallback(c, analysis){
  const linhas = [];
  linhas.push(`O cruzamento do arquivo ACAM "${analysis.fileName}" com os merchants cadastrados do cliente ${c.razaoSocial} totalizou volume de ${fmtMoney(analysis.totalGeral)}, dos quais ${fmtMoney(analysis.totalBrasil)} referem-se a operações identificadas no Brasil.`);
  if(analysis.flags.length){
    linhas.push('Foram identificadas as seguintes divergências que demandam atenção da área de Compliance, à luz da Lei nº 9.613/1998, da Resolução CMN nº 4.595/2017 e da Circular BCB nº 3.978/2020, que tratam de política e procedimentos de PLD-FT:');
    analysis.flags.forEach(f => linhas.push(`- ${f.texto}`));
  } else {
    linhas.push('Não foram identificadas divergências relevantes entre o arquivo ACAM e o cadastro de merchants deste cliente no período analisado.');
  }
  linhas.push('Recomenda-se que o analista responsável documente a presente análise no dossiê do cliente e, em caso de divergências classificadas como alerta, avalie a necessidade de comunicação ao COAF nos termos da Carta Circular nº 4.001/2020, além de reforçar o monitoramento contínuo das operações à luz das Recomendações do GAFI.');
  return linhas.join('\n\n');
}

function aprovarRelatorio(clienteId, relatorioId){
  if(!isGerenteAtivo()){ showToast('Apenas a gerência pode aprovar relatórios.'); return; }
  const c = getClient(clienteId);
  const relatorio = c.relatorios.find(r => r.id === relatorioId);
  relatorio.statusValidacao = 'aprovado';
  relatorio.aprovadoPor = nomeAnalistaAtivo();
  relatorio.aprovadoEm = new Date().toISOString();
  logAction(clienteId, 'Relatório aprovado pela gerência', `Aprovado por: ${relatorio.aprovadoPor}`);
  saveData('Relatório aprovado. O analista já pode baixar o arquivo.');
  abrirRelatorio(clienteId, relatorioId);
}

function rejeitarRelatorio(clienteId, relatorioId){
  if(!isGerenteAtivo()){ showToast('Apenas a gerência pode rejeitar relatórios.'); return; }
  showPrompt('Descreva o motivo da rejeição para orientar o analista:', (motivo) => {
    const c = getClient(clienteId);
    const relatorio = c.relatorios.find(r => r.id === relatorioId);
    relatorio.statusValidacao = 'rejeitado';
    relatorio.comentarioGerencia = motivo.trim();
    relatorio.aprovadoPor = nomeAnalistaAtivo();
    relatorio.aprovadoEm = new Date().toISOString();
    logAction(clienteId, 'Relatório rejeitado pela gerência', `Motivo: ${relatorio.comentarioGerencia}`);
    saveData('Relatório rejeitado e devolvido ao analista.');
    abrirRelatorio(clienteId, relatorioId);
  });
}

function baixarRelatorio(clienteId, relatorioId){
  const c = getClient(clienteId);
  const relatorio = c.relatorios.find(r => r.id === relatorioId);
  if(relatorio.statusValidacao !== 'aprovado'){ showToast('O relatório precisa ser aprovado pela gerência antes do download.'); return; }
  const resumo = relatorio.resumo;
  const topMerchantsHtml = resumo.topMerchants.map(([nome, valor]) => `
    <tr><td>${escapeHtml(nome)}</td><td>${fmtMoney(valor)}</td></tr>`).join('');
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório ACAM — ${escapeHtml(resumo.cliente)}</title>
<style>
body{font-family:Arial,sans-serif; color:#292929; margin:0; background:#fff;}
.header{background:#1f41ff; color:#fff; padding:24px 32px;}
.body{padding:32px; max-width:900px; margin:0 auto;}
h2{font-size:13px; text-transform:uppercase; color:#666; border-bottom:1px solid #e6e6e6; padding-bottom:8px;}
table{width:100%; border-collapse:collapse; margin-bottom:16px;}
th,td{text-align:left; padding:8px; border-bottom:1px solid #e6e6e6; font-size:13px;}
.narrativa{white-space:pre-wrap; background:#f9faff; border:1px solid #e6e6e6; border-radius:8px; padding:16px; font-size:13px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.small{font-size:11px; color:#666;}
</style></head><body>
<div class="header"><strong>Remessa Online</strong> — Dossiê de Análise</div>
<div class="body">
  <h2>Dados do cliente</h2>
  <div class="grid">
    <div><div class="small">Razão social</div><div><strong>${escapeHtml(resumo.cliente)}</strong></div></div>
    <div><div class="small">CNPJ</div><div><strong>${escapeHtml(resumo.cnpj)}</strong></div></div>
    <div><div class="small">Conferido por</div><div><strong>${escapeHtml(relatorio.conferidoPor||'—')}</strong></div></div>
    <div><div class="small">Aprovado por</div><div><strong>${escapeHtml(relatorio.aprovadoPor||'—')} em ${relatorio.aprovadoEm ? new Date(relatorio.aprovadoEm).toLocaleString('pt-BR') : '—'}</strong></div></div>
  </div>
  <h2>Resumo quantitativo</h2>
  <div class="grid">
    <div>Volume total: <strong>${fmtMoney(resumo.totalGeral)}</strong></div>
    <div>Volume no Brasil: <strong>${fmtMoney(resumo.totalBrasil)}</strong></div>
  </div>
  <h2>Top merchants por volume</h2>
  <table><thead><tr><th>Merchant</th><th>Volume</th></tr></thead><tbody>${topMerchantsHtml}</tbody></table>
  <h2>Análise de compliance</h2>
  <div class="narrativa">${escapeHtml(relatorio.narrativa)}</div>
  <p class="small">Relatório gerado pelo eFX Check — Remessa Online. Aprovado pela gerência em ${relatorio.aprovadoEm ? new Date(relatorio.aprovadoEm).toLocaleString('pt-BR') : '—'}.</p>
</div>
</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relatorio-acam-${normalize(resumo.cliente).replace(/\s+/g,'-')}-${todayISO()}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  logAction(clienteId, 'Relatório baixado pelo analista', relatorio.fileName);
  saveData();
  showToast('Download iniciado.');
}

/* ======================= INIT ======================= */
// Espera o documento inteiro terminar de carregar (todas as tags <script>
// já executadas) antes de iniciar. Isso torna a inicialização resistente
// a qualquer problema de ordem entre os arquivos incluídos via include()
// no Apps Script — mesmo que algo tenha ficado fora de ordem, o app só
// tenta rodar depois que TUDO já foi carregado.
function iniciarApp(){
  (async function init(){
  try{
    const topbarLogoImg = document.getElementById('topbar-logo-img');
    if(topbarLogoImg) topbarLogoImg.src = 'data:image/png;base64,' + LOGO_B64;

    if(!getBackendUrl()){
      const app = document.getElementById('app');
      if(app) app.innerHTML = renderConfigBackend();
      dataLoaded = true;
      return;
    }

    await loadData();
    render();
  }catch(err){
    console.error('Erro ao iniciar o eFX Check:', err);
    const app = document.getElementById('app');
    if(app){
      app.innerHTML = `
        <div class="card card-pad" style="max-width:640px; margin:48px auto;">
          <div class="empty-title" style="color:var(--text-error);">Não foi possível carregar o eFX Check</div>
          <div class="muted" style="margin-top:8px; white-space:pre-wrap;">${(err && err.message) || String(err)}</div>
          <div class="muted" style="margin-top:16px; font-size:12px;">Tire um print desta mensagem e envie para quem está configurando a ferramenta — não é necessário abrir o console (F12) para isso.</div>
        </div>`;
    }
  }
})();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', iniciarApp);
} else {
  // O documento já terminou de carregar (raro, mas possível dependendo
  // de onde este trecho acaba entrando na página) — inicia direto.
  iniciarApp();
}

</script>
